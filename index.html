<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lingua Sacra Collatinus Analyzer</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #211f1a; background: #f2eee4; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(46rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #dcd3c2; border-radius: 1rem; background: #fffdf8; box-shadow: 0 1rem 3rem #49382718; }
      h1 { margin: 0 0 .4rem; font-family: Georgia, serif; }
      p { color: #6f6a5f; }
      form { display: flex; gap: .5rem; }
      input { flex: 1; padding: .75rem; border: 1px solid #cfc4b2; border-radius: .5rem; font-size: 1rem; }
      button { padding: .75rem 1rem; border: 0; border-radius: .5rem; color: white; background: #762f3e; font-weight: 700; }
      pre { max-height: 32rem; overflow: auto; padding: 1rem; border-radius: .5rem; color: #eee; background: #28232a; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>Collatinus analyzer</h1>
      <p>Full runtime morphology in the browser. Try <i>erat</i>, <i>principio</i>, or <i>gratiæ</i>.</p>
      <form id="lookup"><input id="word" value="principio" aria-label="Latin word" /><button>Analyze</button></form>
      <pre id="result">Loading analyzer…</pre>
    </main>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
